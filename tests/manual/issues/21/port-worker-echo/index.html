<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issue #21 · port worker echo</title>
    <link rel="stylesheet" href="../../../shared/styles.css" />
  </head>
  <body>
    <main class="cleanup-test">
      <p class="cleanup-test__eyebrow">
        <a href="../../">← Issue #21</a>
      </p>
      <h1>Echo origin worker</h1>
      <p>
        Симулирует worker → <code>emitPort</code> → fan-out. До фикса origin получал своё
        сообщение; после — только peer.
      </p>

      <button type="button" class="cleanup-test__run">Запустить</button>

      <dl class="cleanup-test__metrics">
        <div>
          <dt>Origin port posts</dt>
          <dd data-testid="echo-origin-posts">—</dd>
        </div>
        <div>
          <dt>Peer port posts</dt>
          <dd data-testid="echo-peer-posts">—</dd>
        </div>
        <div>
          <dt>Статус</dt>
          <dd data-testid="echo-status" data-state="idle">idle</dd>
        </div>
      </dl>

      <pre class="cleanup-test__hint">
Ожидание после фикса:
  origin posts = 0
  peer posts   = 1
  status       = PASS
      </pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
