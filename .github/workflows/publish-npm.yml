name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish. Defaults to the selected ref or release tag.
        required: false
        type: string
      version:
        description: Expected package version. Defaults to package.json.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish 2mqjs
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Resolve release inputs
        id: release-inputs
        run: |
          REF_NAME="${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          EXPECTED_VERSION="${{ inputs.version }}"

          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "expected_version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-inputs.outputs.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify package metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedVersion = process.env.EXPECTED_VERSION || pkg.version;
          const refName = process.env.REF_NAME || '';
          const tagLike = refName && refName !== 'master' && refName !== 'main';

          if (pkg.name !== '2mqjs') {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }

          if (pkg.version !== expectedVersion) {
            throw new Error(`package.json version ${pkg.version} does not match expected ${expectedVersion}`);
          }

          if (pkg.repository?.url !== 'https://github.com/Poliklot/2mqjs') {
            throw new Error(`package.json repository.url must match provenance repository, got ${pkg.repository?.url}`);
          }

          if (tagLike && refName !== `v${pkg.version}` && refName !== `2mqjs-v${pkg.version}` && refName !== pkg.version) {
            throw new Error(`Ref ${refName} does not match package version ${pkg.version}`);
          }

          console.log(`Ready to publish ${pkg.name}@${pkg.version} from ${refName || 'current ref'}`);
          NODE
        env:
          EXPECTED_VERSION: ${{ steps.release-inputs.outputs.expected_version }}
          REF_NAME: ${{ steps.release-inputs.outputs.ref_name }}

      - name: Run release gate
        run: npm run release:check

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
